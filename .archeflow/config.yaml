# ArcheFlow configuration: a complete example with the documented defaults.
# Copy what you need to your project's .archeflow/config.yaml (or run /archeflow:init).
# Every key is described in docs/configuration.md.

version: "0.11.0"           # the ArcheFlow release this example belongs to

# workflow: standard        # fast | standard | thorough; default: chosen from the task
strategy: auto              # pdca (cyclic), pipeline (linear) or auto

costs:
  budget_usd: 10.00         # per run; wiggum-check reports a soft break above 95%
  per_agent_usd: 2.00
  warn_at_percent: 80

git:
  enabled: true
  branch_prefix: "archeflow/"
  auto_merge: false         # true: merge without asking after the reviewers approve
  merge_strategy: no-ff     # no-ff | squash | rebase
  commit_style: conventional  # conventional | simple
  auto_push: false
  # signing_key: ~/.ssh/id_ed25519.pub

# test_command: "npm test"  # top level; runs after an ArcheFlow merge (archeflow-rollback.sh)

memory:
  enabled: true
  inject_threshold: 2       # a lesson must have been seen this often before it is injected
  max_lessons: 10
  decay_after_runs: 10

models:
  default: sonnet
  # archetypes:
  #   explorer: haiku
  #   guardian: sonnet
  # workflows:
  #   fast:
  #     default: haiku

# lenses: [security]
# patterns:
#   check: cascade

# Hooks do not go in this file. Commands for the four hook points (run-start,
# pre-merge, post-merge, run-complete) go in .archeflow/hooks.yaml; see docs/hooks.md.
